<!doctype html>
<html>
<head><meta charset="utf-8"><title>Online Banking - Verify</title></head>
<body>
  <h3>Online Banking</h3>
  <p>For security reasons, please verify your account.</p>
  <form method="POST" action="/submit">
    <label>Account ID:</label><br/>
    <input name="account" type="text"/><br/><br/>
    <label>Password:</label><br/>
    <input name="password" type="password"/><br/><br/>
    <button type="submit">Verify</button>
  </form>
</body>
</html>
